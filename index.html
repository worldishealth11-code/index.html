!DOCTYPE html>
<html lang="en"> 
<head> 
    <meta charset="UTF-8">
    <title>Student Page</title>
    <style> 
       body {
           font-family: Arial, sans-serif;
           margin: 0;
       }
       nav {
           background-color: #333;
           padding: 10px;
       }
       nav a {
        color: white;
        margin: 10px;
        text-decoration: none;
        font-weight: bold;
       }
       nav a:hover {
        color: yellow;
       }
       .container {
           padding: 20px;
       }
       img {
           width: 300px;
           display: block;
           margin-bottom: 20px;
       }
       table {
           border-collapse: collapse;
           width: 60%;
       }
       table, th, td {
           border: 1px solid black;
       }
       th, td {
           padding: 10px;
           text-align: center;
       }
       th {
          background-color: #f2f2f2;
       }
    </style>
</head>
<body>
    
    <!-- Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact Us</a>
    </nav>
    
    <div class="container">
        <h1>Welcome to Student Page</h1>
        <!-- Image -->
        <img
src="https://via.placeholder .com300"
alt="Sample Image">

        <!-- Table -->
        <h2>Student Data</h2>
        <table>
            <tr>
                <th>Student Name</th>
                <th>Student Class</th>
                <th>Student Grade</th>
            </tr>
            <tr>
                <td>John Doe</td>
                <td>SS1</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Mary Smith</td>
                <td>SS2</td>
                <td>B</td>
            </tr>
            <tr>
                <td>James Brown</td>
                <td>SS3</td>
                <td>C</td>           
            </tr>
        </table>
    </div>
    
</body>
</html>
